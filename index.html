<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LCDPro</title>
<style>
:root{box-sizing:border-box;--top:max(92px,calc(env(safe-area-inset-top) + 80px));--pb:124px}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#1f7bff;display:grid;place-items:center;
 padding:var(--top) max(24px,env(safe-area-inset-right)) var(--pb) max(24px,env(safe-area-inset-left));
 -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif}
.stage{position:relative;aspect-ratio:0.89746;width:min(100%,calc((100dvh - var(--top) - var(--pb)) * 0.89746));max-width:620px;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);transition:transform .7s cubic-bezier(.5,0,.2,1)}
.stage.flip{transform:rotate(180deg)}
.stage img{display:block;width:100%;height:100%;pointer-events:none}
.lcd{position:absolute;left:36.2%;top:36.7%;width:31.8%;height:6.4%;background:linear-gradient(#020507,#000);border-radius:2px;display:flex;align-items:center;justify-content:center}
.lcd svg{width:96%;height:auto;filter:drop-shadow(0 0 2px #19c8ff) drop-shadow(0 0 7px #0a8cff)}
.s{fill:#0b3f52;opacity:.16}
.s.on{fill:#3fe0ff;opacity:1}
.k{position:absolute;width:7.4%;height:6.1%;transform:translate(-50%,-50%);background:transparent;border:0;padding:0;cursor:pointer;border-radius:11px;outline:none}
.k::after{content:"";position:absolute;inset:0;border-radius:11px;background:rgba(0,0,0,.3);box-shadow:inset 0 2px 5px rgba(0,0,0,.6);opacity:0;transition:opacity .05s}
.k.down::after{opacity:1}
.k:focus-visible{box-shadow:0 0 0 2px #3fe0ff}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom));width:min(calc(100% - 48px),520px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.bar input{flex:1 1 140px;min-width:0;background:#0a5cff;color:#fff;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:8px 14px;font-size:16px;text-transform:uppercase;outline:none;-webkit-user-select:text;user-select:text}
.bar input::placeholder{color:#cfe3ff;text-transform:none}
.bar button:hover,.lang:hover,.top #snd:hover{background:#3d95ff}
.bar button{background:#0a5cff;color:#fff;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer}
.top{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:12px;background:#0a5cff;box-shadow:0 2px 12px rgba(0,30,120,.35);padding:max(12px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) 12px max(24px,env(safe-area-inset-left))}
.top a{display:flex;align-items:center;text-decoration:none}
.top .logo img{width:40px;height:40px;border-radius:10px;display:block}
.top .name{color:#fff;font-size:20px;font-weight:700;letter-spacing:.05em}
.top .name:hover{text-decoration:underline}
.top #snd{margin-left:auto;background:#3d95ff;color:#fff;border:1.5px solid rgba(255,255,255,.6);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.lang{display:flex;gap:6px;background:#3d95ff;border:1.5px solid rgba(255,255,255,.6);border-radius:999px;padding:5px 7px;cursor:pointer}
.fl{display:block;width:30px;height:20px;border-radius:4px;overflow:hidden;opacity:.4;filter:grayscale(.7);transition:opacity .15s}
.fl.on{opacity:1;filter:none;box-shadow:0 0 0 2px #fff}
.fl svg{display:block;width:100%;height:100%}
.intro{position:fixed;inset:0;z-index:10;background:#1f7bff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(28px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));cursor:pointer;transition:opacity .45s}
.intro img{display:block;min-height:0;max-width:100%;max-height:calc(100dvh - 150px);object-fit:contain;border-radius:14px;box-shadow:0 18px 40px rgba(0,30,120,.45)}
.intro p{margin:0;color:#fff;font-weight:700;font-size:16px;letter-spacing:.06em;animation:pulse 1.4s ease-in-out infinite}
.intro.out{opacity:0;pointer-events:none}
@keyframes pulse{50%{opacity:.45}}
.toast{position:fixed;left:50%;top:max(84px,calc(env(safe-area-inset-top) + 76px));transform:translate(-50%,-8px);width:min(calc(100% - 48px),400px);background:#0a4fe6;color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:14px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,30,120,.45);z-index:6;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.trow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.toast button{background:#fff;color:#0a4fe6;border:0;border-radius:999px;padding:7px 16px;font-weight:700;font-size:13px;cursor:pointer}
.toast b{display:block;font-size:15px;margin-bottom:3px}
.toast span{display:block;font-size:12px;color:#e3efff;line-height:1.35}
.toast i{display:block;font-style:normal;font-size:11px;margin-top:6px;opacity:.85}
.pauseb{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#0a4fe6;color:#fff;border:2px solid #fff;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;z-index:7;display:none;align-items:center;gap:14px;max-width:calc(100% - 48px);box-shadow:0 10px 30px rgba(0,30,120,.5)}
.pauseb.on{display:flex}
.pauseb button{background:#fff;color:#0a4fe6;border:0;border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px;cursor:pointer;flex:none}
.card .runall{position:sticky;bottom:0;width:100%;margin-top:16px;padding:13px;font-size:15px;font-weight:700;border-radius:12px;box-shadow:0 0 0 6px #1569ff}
.panel{position:fixed;inset:0;display:none;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:rgba(5,35,130,.55);z-index:5}
.panel.open{display:grid}
.card{width:min(100%,480px);max-height:100%;overflow-y:auto;background:#1569ff;color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:16px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:18px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#cfe6ff}
.card p{margin:0;font-size:13px;color:#e3efff;line-height:1.4}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid rgba(255,255,255,.3)}
.row b{display:block;font-size:14px;color:#fff;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.card button{background:#0a4fe6;color:#fff;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;flex:none}
.card button:hover{background:#3d95ff}
.card .close{float:right}
.bar button.q{width:36px;padding:9px 0;font-weight:700}
.bar button.on{background:#fff;color:#0a4fe6}
.bar button.wa{background:#25D366;border-color:#25D366;box-shadow:0 0 12px #25D36688;display:flex;align-items:center;justify-content:center;padding:7px 12px}
.bar button.wa:hover{background:#1ebe5b}
.hint{flex:1 0 100%;text-align:center;color:#f2f2f2;font-size:12px;min-height:1em}
</style>
</head>

<script>
const H=y=>`12,${y} 16,${y-4} 44,${y-4} 48,${y} 44,${y+4} 16,${y+4}`;
const V=(x,a,b)=>`${x},${a} ${x+4},${a+4} ${x+4},${b-4} ${x},${b} ${x-4},${b-4} ${x-4},${a+4}`;
const P={a:H(6),g:H(50),d:H(94),f:V(8,10,46),b:V(52,10,46),e:V(8,54,90),c:V(52,54,90)};
const M={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg','-':'g','E':'adefg',' ':'','A':'abcefg','C':'adef','F':'aefg','G':'acdef','L':'def','P':'abefg','S':'acdfg','U':'bcdef','b':'cdefg','d':'bcdeg','h':'cefg','n':'ceg','o':'cdeg','r':'eg','t':'defg','y':'bcdfg'};
const lcd=document.getElementById('lcd');
let cur='0',acc=0,op=null,fresh=true,err=false,lastOp=null,lastB=0;

function render(){
 let cells=[],neg=false,s=ovr!==null?ovr:(err?'E':cur);
 if(s[0]==='-'){neg=true;s=s.slice(1)}
 for(const ch of s){ if(ch==='.'){ if(cells.length)cells[cells.length-1].dot=true } else cells.push({ch,dot:false}) }
 cells=cells.slice(-8);
 while(cells.length<8)cells.unshift({ch:' ',dot:false});
 cells.unshift({ch:neg?'-':' ',dot:false});
 if(testOn)cells=Array(9).fill({ch:'8',dot:true});
 let out='';
 cells.forEach((c,i)=>{
  const on=M[c.ch]||'';
  out+=`<g transform="translate(${i*70+6},0) skewX(-7)">`;
  for(const k in P)out+=`<polygon class="s${on.includes(k)?' on':''}" points="${P[k]}"/>`;
  out+=`<circle class="s${c.dot?' on':''}" cx="62" cy="94" r="4.5"/></g>`;
 });
 lcd.innerHTML=out;
}
function calc(a,b,o){return o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:(b===0?NaN:a/b)}
function fmt(n){
 if(!isFinite(n)||Math.abs(n)>=1e8){err=true;return '0'}
 n=+n.toPrecision(12);
 const a=Math.abs(n),ip=String(Math.trunc(a)).length;
 let s=a.toFixed(Math.max(0,8-ip));
 if(Math.trunc(+s)>=1e8){err=true;return '0'}
 s=s.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
 return (n<0&&s!=='0'?'-':'')+s;
}
function press(k){
 if(musicLive()){if(stg.classList.contains('flip'))setFlip(false);musicKey(k);return}
 if(game&&k==='=')gameHit();
 if(radio&&k==='=')radioBuzz(op);
 if(err&&k!=='C'&&k!=='AC')return;
 if(/^\d$/.test(k)){
  if(fresh){cur='0';fresh=false}
  if(cur.replace(/[-.]/g,'').length>=8)return;
  cur=(cur==='0')?k:cur+k;
 }else if(k==='.'){
  if(fresh){cur='0';fresh=false}
  if(!cur.includes('.'))cur+='.';
 }else if('+-*/'.includes(k)){
  if(op&&!fresh){acc=calc(acc,parseFloat(cur),op);cur=fmt(acc)}else acc=parseFloat(cur);
  op=k;fresh=true;lastOp=null;
 }else if(k==='='){
  if(op){const b=parseFloat(cur);lastOp=op;lastB=b;acc=calc(acc,b,op);cur=fmt(acc)}
  else if(lastOp){cur=fmt(calc(parseFloat(cur),lastB,lastOp))}
  op=null;fresh=true;
 }else if(k==='%'){
  const v=parseFloat(cur);
  if(op==='*'||op==='/'){cur=fmt(calc(acc,v/100,op));op=null}
  else if(op){cur=fmt(acc*v/100)}
  else cur=fmt(v/100);
  fresh=true;
 }else if(k==='C'){
  if(err){err=false;op=null;lastOp=null}
  cur='0';fresh=true;
 }else if(k==='AC'){
  cur='0';acc=0;op=null;lastOp=null;err=false;fresh=true;
 }
 render();
}

/* sounds */
let ac,mute=false;
function click(k,up){
 if(mute)return;
 try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime,len=Math.floor(ac.sampleRate*.02),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const n=ac.createBufferSource();n.buffer=buf;
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=up?2800:1800;f.Q.value=1.2;
  const g=ac.createGain();g.gain.value=up?.07:.18;
  n.connect(f);f.connect(g);g.connect(ac.destination);n.start(t);
  if(!up&&(!music||(!musicLive()&&!/^\d$/.test(k)))){
   const fr=/^\d$/.test(k)?480+(+k)*16:k==='='?640:/^(C|AC)$/.test(k)?280:400;
   const o=ac.createOscillator(),og=ac.createGain();
   o.type='sine';o.frequency.setValueAtTime(fr,t);o.frequency.exponentialRampToValueAtTime(fr*.6,t+.06);
   og.gain.setValueAtTime(.05,t);og.gain.exponentialRampToValueAtTime(.0001,t+.07);
   o.connect(og);og.connect(ac.destination);o.start(t);o.stop(t+.08);
  }
 }catch(e){}
}

function mName(m){return NN[m%12]+(Math.floor(m/12)-1)}
function mTone(m,ms){
 if(mute||m==null)return;
 try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime,d=Math.max(.08,ms/1000),f=440*Math.pow(2,(m-69)/12),g=ac.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  g.connect(ac.destination);
  ['square','triangle'].forEach((w,i)=>{const o=ac.createOscillator(),og=ac.createGain();o.type=w;o.frequency.value=f;og.gain.value=i?1:.35;o.connect(og);og.connect(g);o.start(t);o.stop(t+d+.05)});
 }catch(e){}
}
function showM(txt,count){
 if(count&&mRec){const c=String(mem.length).padStart(3,'0');txt=txt+' '.repeat(Math.max(1,5-txt.replace(/\./g,'').length))+c}
 ovr=txt;render();
}
function updMus(){const W=X[lang];$('mus').textContent=MX[lang].mus+': '+(music?W.on:W.off);$('mus').classList.toggle('on',music)}
function setMusic(on){
 const M=MX[lang];
 if(on){
  if(busy||allOn){hint.textContent=M.busyMsg;return}
  if(music)return;
  closePanel();setFlip(false);music=true;mGen++;mOct=4;mSharp=false;mRec=false;
  showM('PLAy');hint.textContent=M.hintOn;
 }else musicOff();
 applyLang();
}
function musicOff(quiet){
 if(!music)return;
 music=false;mRec=false;mSharp=false;mGen++;ovr=null;render();
 if(!quiet)hint.textContent=X[lang].hint0;
 updMus();
}
function keyAnim(k,ms){
 const b=btns[k];if(!b)return;
 b.classList.add('down');click(k,false);
 setTimeout(()=>{b.classList.remove('down');click(k,true)},Math.min(260,Math.max(90,ms*.55)));
}
function animNote(m,ms){
 if(m==null){keyAnim('0',ms);return}
 let pc=m%12;const sh=NN[pc].length>1;if(sh)pc--;
 const deg=SEMI.indexOf(pc),o=Math.floor(m/12)-1;
 let kk=deg+1;if(o>4&&deg<2&&!sh)kk=deg+8;
 if(sh)keyAnim('.',ms);keyAnim(String(kk),ms);
}
function playSeq(seq,ms,label){
 const M=MX[lang],g=++mGen;let i=0;
 hint.textContent=M.playing(label);
 (function step(){
  if(g!==mGen)return;
  if(i>=seq.length){showM('End');hint.textContent=M.end;return}
  const n=seq[i++],m=n[0],b=n[1];
  mTone(m,ms*b*.92);animNote(m,ms*b);showM(m==null?'rESt':mName(m));
  setTimeout(step,ms*b);
 })();
}
function showMusicHelp(){
 const M=MX[lang],W=X[lang];card.replaceChildren();

 const hr=el('div','row'),hl=el('div');hl.append(el('p','',M.how));hr.append(hl);card.append(hr);
 card.append(el('h3','',M.keysTitle));
 M.kl.forEach(r=>{const x=el('div','row'),l=el('div');l.append(el('b','',r[0]),el('p','',r[1]));x.append(l);card.append(x)});
 const tr=el('div','row'),tl=el('div');tl.append(el('p','',M.tip));tr.append(tl);card.append(tr);
 card.scrollTop=0;openPanel();
}
function playSong(i){
 if(!music){setMusic(true);if(!music)return}
 closePanel();mSong=(i+1)%SONGS.length;

}
function addMem(m){
 if(mem.length>=100){showM('FULL');hint.textContent=MX[lang].full;return false}
 mem.push(m);return true;
}
function musicKey(k){
 const M=MX[lang];
 if(/^\d$/.test(k)){
  mGen++;
  if(k==='0'){if(mRec&&!addMem(null))return;showM('rESt',1);return}
  const i=+k-1,m=12*(mOct+1)+SEMI[i%7]+12*Math.floor(i/7)+(mSharp?1:0);
  mSharp=false;
  if(mRec&&!addMem(m))return;
  mTone(m,380);showM(mName(m),1);
 }else if(k==='.'){mSharp=!mSharp;hint.textContent=mSharp?M.sharp:M.hintOn}
 else if(k==='+'||k==='-'){mOct=Math.max(2,Math.min(6,mOct+(k==='+'?1:-1)));showM('oC '+mOct,1)}
 else if(k==='*'){mGen++;mRec=!mRec;hint.textContent=mRec?M.rec:M.recOff;showM(mRec?'rEC':'PLAy',1)}
 else if(k==='='){
  if(!mem.length){showM('Err');hint.textContent=M.empty;return}
  playSeq(mem.map(m=>[m,1]),320,mem.length+'')
 }
 else if(k==='%'){const i=mSong;mSong=(mSong+1)%SONGS.length;showM('S '+(i+1));playSeq(SONGS[i].s,330,SONGS[i].n[lang])}
 else if(k==='/'){mGen++;showM('PLAy');hint.textContent=M.hintOn}
 else if(k==='C'){mGen++;if(mem.length)mem.pop();showM(mRec?'rEC':'PLAy',1)}
 else if(k==='AC'){mGen++;mem=[];mRec=false;mOct=4;mSharp=false;showM('PLAy');hint.textContent=M.cleared}
}

   const k=x.k[i++],nx=x.k[i];

   else{tap(k);wait(next,(k==='='&&nx!==undefined&&nx!=='~')?1800:x.ms*SLOW)}

   busy=false;hint.textContent=x.end;
   let pend=2;const one=()=>{if(--pend===0&&x.done)x.done()};
   speakThen(x.end,one,2500);
   if(x.after)x.after(one);else one();

 }

 const i=allOrder[allIdx],T=W.tr[i];
 render();
 showToast((allIdx+1)+'/'+allOrder.length+' · '+T.t,T.d,W.clickPause,true);
 const go=()=>{
  const g=G[i]();
  runTrick({k:g.k,ms:g.ms,fromAll:1,say:T.say(...g.a),end:T.end(...g.a),after:g.after||(g.flip?cb=>{setFlip(true);cb()}:0),done:()=>wait(()=>playAt(allIdx+1),1500)});
 };
 if(readOn){say(T.t+'. '+T.d);wait(go,1200)}
 else speakThen(T.t+'. '+T.d,go,4000);
}
function runAll(){
 if(busy||allOn)return;
 closePanel();allOn=true;paused=false;held=null;

 W.tr.forEach((T,i)=>{if(!T.r)allOrder.push(i)});W.tr.forEach((T,i)=>{if(T.r)allOrder.push(i)});
 playAt(0);
}

const SHARE_MSG='LCDPro easylandx.github.io/lcdpro';
const isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
let shareBlob=null,shareFile=null,shareImgP=null,msgEl=null,msgT=0;
function msgToast(m){
 if(!msgEl){msgEl=document.createElement('div');msgEl.style.cssText='position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:90vw;padding:12px 18px;border-radius:22px;background:#fff;color:#0a4fe6;font:700 14px/1.3 system-ui,sans-serif;box-shadow:0 10px 26px rgba(0,30,120,.45);text-align:center;transition:opacity .3s;pointer-events:none';document.body.appendChild(msgEl)}
 msgEl.textContent=m;msgEl.style.opacity='1';clearTimeout(msgT);msgT=setTimeout(()=>{msgEl.style.opacity='0'},4000);
}
function legacyCopy(x){try{const ta=document.createElement('textarea');ta.value=x;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,x.length);document.execCommand('copy');document.body.removeChild(ta)}catch(e){}}
function copyText(x){try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(x).catch(()=>legacyCopy(x))}catch(e){}legacyCopy(x)}
function prepShareImage(){
 if(shareImgP)return shareImgP;
 shareImgP=fetch(SHARE_IMG).then(r=>r.blob()).then(b=>createImageBitmap(b)).then(bm=>{
  const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);
  return new Promise((ok,ko)=>c.toBlob(x=>x?ok(x):ko(),'image/png'));
 }).then(png=>{shareBlob=png;try{shareFile=new File([png],'lcdpro.png',{type:'image/png'})}catch(e){}return png});
 shareImgP.catch(()=>{});return shareImgP;
}
setTimeout(prepShareImage,600);
function openWAApp(enc){
 const fell=setTimeout(()=>{if(!document.hidden)location.href='https://wa.me/?text='+enc},1500);
 document.addEventListener('visibilitychange',function once(){if(document.hidden){clearTimeout(fell);document.removeEventListener('visibilitychange',once)}});
 location.href='whatsapp://send?text='+enc;
}
function waShare(){
 const msg=SHARE_MSG,enc=encodeURIComponent(msg),es=lang==='es';
 if(isMobile){
  const canFile=shareFile&&navigator.share&&navigator.canShare&&navigator.canShare({files:[shareFile]});
  if(canFile){navigator.share({files:[shareFile],text:msg}).catch(e=>{if(e&&e.name==='AbortError')return;openWAApp(enc)});return}
  prepShareImage();openWAApp(enc);return;
 }
 let wrote=false;
 try{
  if(navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem){
   const pr=shareBlob?Promise.resolve(shareBlob):prepShareImage();
   navigator.clipboard.write([new ClipboardItem({'image/png':pr})]).then(()=>msgToast(es?'Imagen copiada: elige un chat y pulsa Ctrl+V para añadirla':'Image copied — choose a chat, then press Ctrl+V to add it')).catch(()=>{copyText(msg);msgToast(es?'Mensaje copiado: pulsa Ctrl+V en WhatsApp':'Message copied — press Ctrl+V in WhatsApp')});
   wrote=true;
  }
 }catch(e){}
 if(!wrote){copyText(msg);msgToast(es?'Mensaje copiado: pulsa Ctrl+V en WhatsApp':'Message copied — press Ctrl+V in WhatsApp')}
 const w=window.open('https://web.whatsapp.com/send?text='+enc,'_blank');
 try{if(w)w.opener=null}catch(e){}
 if(!w)location.href='https://web.whatsapp.com/send?text='+enc;
}
$('wa').onclick=waShare;
render();
